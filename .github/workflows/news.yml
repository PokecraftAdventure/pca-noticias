# Actualiza news.json leyendo los canales de Discord (solo lectura). El token vive en
# Settings > Secrets > Actions > DISCORD_BOT_TOKEN; nunca en el repositorio.
name: Actualizar noticias

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Leer Discord y escribir news.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node tools/news-bot.js news.json
      - name: Guardar si cambio
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add news.json
            git commit -m "Actualizar noticias"
            git push
          fi
